[package]
name = "agentrix-site-mail"
version = "0.1.0"
edition = "2024"
publish = false
description = "Agentrix Website Phase 5: mailbox intake, tiered held replies, and approval-gated sends"

[workspace]

[dependencies]
agentrix-site-inbox = { path = "../site-inbox" }
chrono = "0.4"
imap = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"] }
mailparse = "0.16"
native-tls = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "json", "macros"] }
thiserror = "2"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
