[package]
name = "agentrix-site-release"
version = "0.1.0"
edition = "2024"
publish = false
description = "Agentrix Website Phase 3: signed release store, LaunchGate admission, and rollback to a named prior release"

[workspace]

[dependencies]
agentrix-site-edge = { path = "../site-edge" }
agentrix-site-inbox = { path = "../site-inbox" }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "json", "macros"] }
thiserror = "2"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
