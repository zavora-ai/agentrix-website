[package]
name = "agentrix-site-migrate"
version = "0.1.0"
edition = "2024"
publish = false
description = "Agentrix Website Phase 9: credential-free migration from public evidence with a parity gate"

[workspace]

[dependencies]
agentrix-site-edge = { path = "../site-edge" }
agentrix-site-inbox = { path = "../site-inbox" }
agentrix-site-release = { path = "../site-release" }
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
