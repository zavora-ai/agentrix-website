[package]
name = "agentrix-site-growth"
version = "0.1.0"
edition = "2024"
publish = false
description = "Agentrix Website Phase 6: budgets with halting caps, KPI breach demotion, outreach/social targets, Analyst digest"

[workspace]

[dependencies]
agentrix-site-concierge = { path = "../site-concierge" }
agentrix-site-defense = { path = "../site-defense" }
agentrix-site-inbox = { path = "../site-inbox" }
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "json", "macros"] }
thiserror = "2"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
