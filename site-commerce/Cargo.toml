[package]
name = "agentrix-site-commerce"
version = "0.1.0"
edition = "2024"
publish = false
description = "Agentrix Website Phase 7: held payments — propose, owner approval, idempotent completion with budgeted fees"

[workspace]

[dependencies]
agentrix-site-growth = { path = "../site-growth" }
agentrix-site-inbox = { path = "../site-inbox" }
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "json", "macros"] }
thiserror = "2"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
