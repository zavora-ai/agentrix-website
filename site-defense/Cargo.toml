[package]
name = "agentrix-site-defense"
version = "0.1.0"
edition = "2024"
publish = false
description = "Agentrix Website Phase 8: probe/watch targets, freeze and quiet hours, incident drill, tenant isolation"

[workspace]

[dependencies]
agentrix-site-edge = { path = "../site-edge" }
agentrix-site-inbox = { path = "../site-inbox" }
agentrix-site-release = { path = "../site-release" }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "json", "macros"] }
thiserror = "2"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
